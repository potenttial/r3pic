<style id="r3-css">
/* Cuarto oscuro: hoja de contactos con luz de seguridad. Rojo N3 para actuar, turquesa 1% para coincidencias. */
:root{
  color-scheme:dark;
  --ink:#080b0e; --sheet:#10161a; --raise:#172026; --line:#2a363d;
  --paper:#eef3f2; --dim:#9fb0b3;
  --safelight:#e4492f; --safelight-ink:#ffffff; --match:#5fc9cf; --maybe:#e8b45a;
  --display:"HelveticaNeue-Light","Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:var(--display);
  --mono:var(--display);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ink);color:var(--paper);font:300 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
a{color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3,b,strong,button,input,label{font-weight:300}
body{font-synthesis:none;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--match);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.narrow{max-width:540px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.brand{font:300 22px/1 var(--display);text-decoration:none;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--safelight)}
.top-r{display:flex;align-items:center;gap:8px}
.chip{font:300 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:6px 7px}
.lang{background:none;border:1px solid var(--line);border-radius:3px;padding:5px 8px;font:300 12px/1 var(--mono);letter-spacing:.06em;cursor:pointer;color:var(--paper)}
.eyebrow{font:300 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--match)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:6px;border:1px solid transparent;background:var(--safelight);color:var(--safelight-ink);font:300 16px/1.2 var(--body);text-decoration:none;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.42;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--paper)}
.btn.ghost:hover{border-color:var(--dim)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px}
.note{color:var(--dim);font-size:14px}

/* Portada */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:36px 44px}
.hero h1{font-size:clamp(68px,12vw,136px);font-weight:300;letter-spacing:-.045em;line-height:.92}
.hero h1 i{font-style:normal;color:var(--safelight)}
.hero h2{font-size:clamp(25px,3.4vw,38px);font-weight:300;letter-spacing:-.02em;margin-top:18px}
.hero p{color:var(--dim);margin-top:14px;max-width:46ch}
.strip{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.strip figure{margin:0}
.strip svg{display:block;width:100%;height:auto;border-radius:2px}
.strip figcaption{font:300 12px/1.3 var(--mono);color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip figcaption b{font-weight:300;color:var(--match)}
.strip-cap{grid-column:1/-1;font:300 12px/1.4 var(--mono);color:var(--dim);border-top:1px solid var(--line);padding-top:8px}
.entries{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.entry{display:flex;flex-direction:column;gap:6px;padding:22px;border:1px solid var(--line);border-radius:6px;text-decoration:none;background:var(--sheet)}
.entry:hover{border-color:var(--dim)}
.entry h3{font-size:25px;font-weight:300;letter-spacing:-.01em}
.entry span{color:var(--dim)}
.entry b{margin-top:8px;font:300 14px/1 var(--body);color:var(--match)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-block:40px 12px;list-style:none;margin:0;padding-left:0;counter-reset:s}
.steps li{counter-increment:s}
.steps li::before{content:"0" counter(s);display:block;font:300 13px/1 var(--mono);color:var(--safelight);margin-bottom:10px}
.steps b{display:block;font:300 19px/1.2 var(--display);margin-bottom:4px}
.steps span{color:var(--dim);font-size:15px}
.what{padding-block:30px 8px;max-width:68ch}
.what h2{font-size:22px;font-weight:300;margin-bottom:8px}
.what p{color:var(--dim)}

/* Pie de marcas */
.foot{margin-top:56px;border-top:1px solid var(--line)}
.foot .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px 32px;padding-block:22px}
.foot-t{font:300 12px/1.5 var(--mono);color:var(--dim);max-width:30ch}
.logos{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.logos span{font:300 12px/1 var(--mono);color:var(--dim)}
.logos img{display:block;height:auto}
.logo-n3{width:118px}.logo-1p{width:150px}

/* Asistente */
.flow{padding-block:16px 8px;display:flex;flex-direction:column;gap:18px}
.flow h1{font-size:clamp(32px,8vw,42px);font-weight:300;letter-spacing:-.025em}
.meta{font:300 13px/1.5 var(--mono);color:var(--dim)}
.perm{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:18px}
.perm h2{font-size:19px;font-weight:300;margin-bottom:10px}
.perm ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.perm li{padding-left:18px;position:relative;font-size:15px}
.perm li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;background:var(--match)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--safelight)}
.notice{margin-top:14px;font-size:14px;color:var(--dim)}
.notice summary{cursor:pointer;color:var(--match)}
.notice p{margin-top:8px}
.sig{margin-top:12px}
.rcpt{font-size:13px;color:var(--dim);border-left:2px solid var(--match);padding-left:10px;overflow-wrap:anywhere}
.how{margin:0;padding-left:20px;font-size:14px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.oval{position:relative;width:min(72vw,270px);aspect-ratio:3/4;margin:6px auto;border-radius:50%/42%;border:2px dashed var(--match);display:grid;place-items:center;overflow:hidden;background:var(--sheet)}
.oval svg{width:60%;opacity:.5}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font:300 12px/1.4 var(--mono);color:var(--dim);text-align:center}
.scan{position:relative;width:min(76vw,290px);aspect-ratio:3/4;margin:6px auto;border-radius:4px;overflow:hidden;background:var(--sheet)}
.scan img{width:100%;height:100%;object-fit:cover;display:block}
.scan::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--match);box-shadow:0 0 18px 4px var(--match);top:0;animation:sweep 1.7s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 3px)}}
.fb{--c:var(--match);position:absolute;pointer-events:none;background:
 linear-gradient(var(--c),var(--c)) 0 0/12px 2px,linear-gradient(var(--c),var(--c)) 0 0/2px 12px,
 linear-gradient(var(--c),var(--c)) 100% 0/12px 2px,linear-gradient(var(--c),var(--c)) 100% 0/2px 12px,
 linear-gradient(var(--c),var(--c)) 0 100%/12px 2px,linear-gradient(var(--c),var(--c)) 0 100%/2px 12px,
 linear-gradient(var(--c),var(--c)) 100% 100%/12px 2px,linear-gradient(var(--c),var(--c)) 100% 100%/2px 12px;background-repeat:no-repeat}
.fb.maybe{--c:var(--maybe)}.fb.plain{--c:rgba(238,243,242,.75)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--dim);font-weight:300;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--paper);border-color:var(--safelight)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{position:relative;display:block;padding:0;border:0;background:var(--sheet);cursor:pointer;border-radius:3px;overflow:hidden;width:100%;line-height:0}
.tile .pic{position:relative;display:block}
.tile img{display:block;width:100%;height:auto}
.tier{position:absolute;left:6px;top:6px;font:300 12px/1 var(--mono);padding:5px 6px;border-radius:2px;background:var(--match);color:#062326}
.tier.maybe{background:var(--maybe);color:#2e1f05}
.empty{border:1px dashed var(--line);border-radius:6px;padding:26px 18px;text-align:center;color:var(--dim)}
.lb{position:fixed;inset:0;z-index:20;background:rgba(4,6,8,.95);display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lb img{max-height:100%;max-width:100%;object-fit:contain}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:4px;font-weight:300;font-size:14px;max-width:min(92vw,460px)}

/* Fotógrafo */
.studio{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start;padding-block:10px}
.studio h1{font-size:clamp(30px,4vw,40px);font-weight:300;letter-spacing:-.025em;grid-column:1/-1}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-size:17px;font-weight:300}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
.field input{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px;font-size:15px;color:var(--paper);width:100%;min-width:0}
.qr{background:#fff;border-radius:4px;padding:12px;width:100%;max-width:240px;margin:0 auto}
.qr svg,.qr canvas{display:block;width:100%;height:auto}
.url{font:300 12px/1.4 var(--mono);color:var(--dim);overflow-wrap:anywhere}
.pill{align-self:flex-start;font:300 12px/1 var(--mono);letter-spacing:.04em;padding:6px 8px;border-radius:3px;border:1px solid var(--line)}
.pill.live{background:var(--match);color:#062326;border-color:var(--match)}
.pill.dirty{color:var(--maybe);border-color:var(--maybe)}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--sheet);padding:12px 14px;min-width:0}
.stat b{display:block;font:300 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font:300 12px/1.3 var(--mono);color:var(--dim)}
.meter{height:4px;background:var(--line);margin-top:7px}
.meter i{display:block;height:100%;background:var(--match)}
.meter i.hot{background:var(--maybe)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:1.5px dashed var(--line);border-radius:6px;padding:26px 16px;cursor:pointer;background:transparent}
.drop:hover,.drop.over{border-color:var(--match);background:var(--sheet)}
.drop b{font:300 19px/1.2 var(--display)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--safelight);transition:width .2s}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;background:var(--sheet);padding:10px;border-radius:4px;border:1px solid var(--line)}
.frame{min-width:0}
.frame .pic{position:relative;line-height:0}
.frame img{display:block;width:100%;height:auto;border-radius:2px}
.frame-l{display:flex;justify-content:space-between;align-items:center;gap:6px;font:300 12px/1.3 var(--mono);color:var(--dim);margin-top:4px}
.x{background:none;border:0;color:var(--dim);cursor:pointer;font:300 12px/1 var(--mono);padding:4px 2px;text-decoration:underline}
.x:hover{color:var(--safelight)}

@media(max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:14px 26px}
  .entries,.steps{grid-template-columns:minmax(0,1fr)}
  .steps{gap:18px}
  .studio{grid-template-columns:minmax(0,1fr)}
  .side{order:2}
}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.narrow.results{max-width:820px}}
@media(prefers-reduced-motion:reduce){.scan::after{animation:none;top:50%}.prog i{transition:none}}

/* ---- utilidades ---- */
function loadScript(src){return new Promise(function(ok,no){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
var faceReady={};
function loadFace(full){
  var key=full?"full":"lite";
  if(faceReady[key])return faceReady[key];
  faceReady[key]=(async function(){
    if(!window.faceapi)await loadScript(FACE_JS);
    var fa=window.faceapi;
    try{await fa.tf.setBackend("webgl");await fa.tf.ready()}catch(e){await fa.tf.setBackend("cpu");await fa.tf.ready()}
    var jobs=[];
    if(!fa.nets.faceLandmark68Net.isLoaded)jobs.push(fa.nets.faceLandmark68Net.loadFromUri("models"));
    if(!fa.nets.faceRecognitionNet.isLoaded)jobs.push(fa.nets.faceRecognitionNet.loadFromUri("models"));
    if(full&&!fa.nets.ssdMobilenetv1.isLoaded)jobs.push(fa.nets.ssdMobilenetv1.loadFromUri("models"));
    if(!full&&!fa.nets.tinyFaceDetector.isLoaded)jobs.push(fa.nets.tinyFaceDetector.loadFromUri("models"));
    await Promise.all(jobs);
    return fa;
  })();
  faceReady[key].catch(function(){faceReady[key]=null});
  return faceReady[key];
}
function fileImage(file){return new Promise(function(ok,no){var u=URL.createObjectURL(file),i=new Image();i.onload=function(){ok({img:i,url:u})};i.onerror=function(){URL.revokeObjectURL(u);no(new Error("image"))};i.src=u})}
function scaled(img,max){var r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function d2s(fa){var b=new Uint8Array(new Float32Array(fa).buffer),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function s2d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Float32Array(u.buffer)}
function dist(a,b){var x=0;for(var i=0;i<a.length;i++){var d=a[i]-b[i];x+=d*d}return Math.sqrt(x)}
function toBlob(url){var p=url.split(","),b=atob(p[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:"image/jpeg"})}
function bytes(){return STATE.photos.reduce(function(n,p){return n+p.src.length+(p.faces.length*700)},0)}
function fmtMB(n){return (n/1048576).toFixed(1)+" MB"}
function frameNo(i){return "R3·"+String(i+1).padStart(3,"0")}
function view(){var h=location.hash.slice(1);return h==="asistente"||h==="fotografo"?h:""}
function qrUrl(){var b=(STATE.link||PAGE_URL||(HOSTED?location.href:"")).trim();return b?b.split("#")[0]+"#asistente":""}

function frameSvg(n){
  var bg=["#1d2a30","#22303a","#1a2429"][n],pp=[[34,44,10,"#6b7f85"],[66,40,11,"#a4b5b6"],[100,46,10,"#566a70"]];

  if(n===2)pp=[[28,46,9,"#566a70"],[60,44,10,"#6b7f85"],[94,40,12,"#a4b5b6"]];
  var f=pp.reduce(function(a,p){return p[3]==="#a4b5b6"?p:a},pp[0]),b=f[2]*1.7;
  var mark='<path d="M'+(f[0]-b)+' '+(f[1]-b+7)+'v-7h7M'+(f[0]+b-7)+' '+(f[1]-b)+'h7v7M'+(f[0]+b)+' '+(f[1]+b-7)+'v7h-7M'+(f[0]-b+7)+' '+(f[1]+b)+'h-7v-7" fill="none" stroke="#5fc9cf" stroke-width="2"/>';
  return '<svg viewBox="0 0 128 96" role="img" aria-hidden="true"><rect width="128" height="96" fill="'+bg+'"/><rect y="74" width="128" height="22" fill="#0000002e"/>'+pp.map(function(p){return person(p[0],p[1],p[2],p[3])}).join("")+mark+'</svg>';
}

async function runSearch(file){
  var f;
  try{f=await fileImage(file)}catch(e){A.err="noFace";A.step="error";render();return}
  var c=scaled(f.img,960);A.selfie=c.toDataURL("image/jpeg",.8);URL.revokeObjectURL(f.url);
  A.status=t("stLoad");A.step="scan";render();
  function st(k){A.status=t(k);var o=$("status");if(o)o.textContent=A.status}
  var fa;
  try{fa=await loadFace(false)}catch(e){A.selfie=null;A.err="fail";A.step="error";render();return}
  st("stFace");
  await new Promise(function(r){setTimeout(r,60)});
  var found=[];
  try{
    for(var size of [416,608]){
      found=await fa.detectAllFaces(c,new fa.TinyFaceDetectorOptions({inputSize:size,scoreThreshold:.4})).withFaceLandmarks().withFaceDescriptors();
      if(found.length)break;
    }
  }catch(e){A.selfie=null;A.err="fail";A.step="error";render();return}
  if(!found.length){A.selfie=null;A.err="noFace";A.step="error";render();return}
  st("stCmp");
  var me=found.reduce(function(a,b){return b.detection.box.area>a.detection.box.area?b:a}).descriptor,out=[];
  STATE.photos.forEach(function(p){
    var best=null,idx=-1;
    p.faces.forEach(function(x,i){var d=dist(me,s2d(x.d));if(best==null||d<best){best=d;idx=i}});
    if(best!=null&&best<=WEAK)out.push({p:p,d:best,i:idx});
  });
  out.sort(function(a,b){return a.d-b.d});
  me=null;A.selfie=null;
  setTimeout(function(){A.matches=out;A.searched=true;A.tab="mine";A.step="results";render()},500);
}
async function saveFile(name,data){

  if(!cap.downloads){toast(t("saveHint"));return}
  try{await cap.downloads.save({filename:name,data:data});toast(t("saved"))}catch(e){toast(t("declined"))}
}
async function saveZip(){
  var list=(A.searched&&A.tab==="mine")?A.matches.map(function(m){return m.p}):STATE.photos;
  toast(t("zipping"));

    saveFile("r3pic-fotos.zip",await z.generateAsync({type:"blob"}));
  }catch(e){toast(t("declined"))}
}

function qrPng(){
  return new Promise(function(ok,no){
    if(!window.qrcode)return no();
    var q=window.qrcode(0,"M");q.addData(qrUrl());q.make();
    var n=q.getModuleCount(),s=Math.floor(1000/(n+8)),c=document.createElement("canvas"),g=c.getContext("2d");
    c.width=c.height=s*(n+8);g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.fillStyle="#080b0e";
    for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(q.isDark(y,x))g.fillRect((x+4)*s,(y+4)*s,s,s);
    c.toBlob(ok,"image/png");
  });
}
async function addFiles(files){
  var list=[].slice.call(files).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|heic)$/i.test(f.name)});
  if(!list.length||P.busy)return;
  P.busy=true;P.msg="";renderStatus();
  var box=$("progress");
  function prog(txt,pct){if(!box)return;box.hidden=false;box.innerHTML='<p class="note" role="status" style="margin:0 0 6px">'+esc(txt)+'</p><div class="prog"><i style="width:'+pct+'%"></i></div>'}
  prog(t("idxLoad"),3);
  var fa;
  try{fa=await loadFace(true)}catch(e){P.busy=false;P.msg=t("fail");if(box)box.hidden=true;renderStatus();return}
  var skipped=0,bad=[];
  for(var i=0;i<list.length;i++){
    prog(t("idx",{i:i+1,n:list.length,f:list[i].name}),Math.max(3,i/list.length*100));
    await new Promise(function(r){setTimeout(r,30)});
    try{
      var f=await fileImage(list[i]);
      var det=scaled(f.img,1600),res=await fa.detectAllFaces(det,new fa.SsdMobilenetv1Options({minConfidence:.45})).withFaceLandmarks().withFaceDescriptors();
      var src=scaled(f.img,1280).toDataURL("image/jpeg",.76);
      URL.revokeObjectURL(f.url);
      if(bytes()+src.length>MAX_BYTES){skipped=list.length-i;break}
      var w=det.width,h=det.height;
      STATE.photos.push({id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),src:src,name:list[i].name,faces:res.map(function(r){var b=r.detection.box;return{b:[b.x/w*100,b.y/h*100,b.width/w*100,b.height/h*100].map(function(n){return +n.toFixed(2)}),d:d2s(r.descriptor)}})});
      P.dirty=true;renderStats();renderSheet();
    }catch(e){bad.push(list[i].name)}
  }
  P.busy=false;if(box)box.hidden=true;
  var msgs=[];if(skipped)msgs.push(t("skip",{n:skipped}));bad.forEach(function(b){msgs.push(t("bad",{f:b}))});P.msg=msgs.join(" ");
  renderStatus();
}
async function publishEvent(){
  if(!cap.artifact||!P.ack)return;
  P.publishing=true;P.msg="";renderStatus();
  var keep=STATE.publishedAt;
  STATE.publishedAt=new Date().toISOString();
  var html=buildHtml();
  try{try{sessionStorage.setItem("r3-after","1")}catch(e){}
    await cap.artifact.publish(html);
    P.dirty=false;P.publishing=false;P.msg=t("pubOk");renderStatus();
  }catch(e){
    STATE.publishedAt=keep;P.publishing=false;
    try{sessionStorage.removeItem("r3-after")}catch(x){}
    var c=e&&e.code;
    if(c==="conflict")P.msg=t("conflict");
    else if(c==="not_writer"||c==="not_granted"||c==="capability_disabled"||c==="not_declared"||c==="consent_required"){P.readOnly=true;P.msg=t("roErr")}
    else if(c==="too_large")P.msg=t("big");
    else if(c==="rate_limited")P.msg=t("slow");
    else P.msg=t("pubFail");
    renderStatus();
  }
}

/* ---- render y eventos ---- */
function render(){
  var v=view();
  document.documentElement.lang=lang;
  app.innerHTML=v==="asistente"?attendee():v==="fotografo"?studio():landing();
  if(v==="fotografo"){renderStats();renderSheet();renderStatus();renderQr()}
}
function consentOk(){var a=$("agree"),g=$("sig");return !!(a&&g&&a.checked&&g.value.trim().length>=3)}
var ACTS={
  lang:function(){lang=lang==="es"?"en":"es";try{localStorage.setItem("r3-lang",lang)}catch(e){}render()},
  allow:function(){if(!consentOk())return;A.consent={name:$("sig").value.trim(),at:new Date().toLocaleString(lang==="es"?"es-MX":"en-US",{dateStyle:"medium",timeStyle:"short"}),id:"R3-"+Math.random().toString(36).slice(2,8).toUpperCase()};A.step="camera";render()},
  skip:function(){A.consent=null;A.searched=false;A.matches=null;A.step="results";render()},
  toConsent:function(){A.step="consent";render()},
  toCamera:function(){A.step="camera";A.err=null;render()},
  tab:function(el){A.tab=el.dataset.v;render()},
  open:function(el){A.open=el.dataset.id;render()},
  closeLb:function(){A.open=null;render()},
  save:function(el){var p=STATE.photos.find(function(x){return x.id===el.dataset.id});if(p)saveFile("r3pic-"+String(STATE.photos.indexOf(p)+1).padStart(3,"0")+".jpg",toBlob(p.src))},
  zip:saveZip,
  reset:function(){A={step:"consent",tab:"mine",matches:null,selfie:null,err:null,status:"",open:null,searched:false};render()},
  publish:publishEvent,
  exportEv:function(){if(!P.ack)return;STATE.publishedAt=new Date().toISOString();saveFile("event.json",new Blob([JSON.stringify(STATE)],{type:"application/json"}))},
  rm:function(el){STATE.photos=STATE.photos.filter(function(p){return p.id!==el.dataset.id});P.dirty=true;renderStats();renderSheet();renderStatus()},
  copy:function(){var u=qrUrl(),f=$("f-link");if(!u)return;function fb(){if(f){f.focus();f.select()}}
    try{navigator.clipboard.writeText(u).then(function(){toast(t("copied"))},fb)}catch(e){fb()}},
  dlqr:function(){qrPng().then(function(b){saveFile("r3pic-qr.png",b)},function(){})}
};
document.addEventListener("click",function(e){var el=e.target.closest("[data-act]");if(el&&ACTS[el.dataset.act])ACTS[el.dataset.act](el)});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="agree"&&$("allow"))$("allow").disabled=!consentOk();
  if(el.id==="ack"){P.ack=el.checked;renderStatus()}
  if(el.id==="selfie"&&el.files[0])runSearch(el.files[0]);
  if(el.id==="files"){addFiles(el.files);el.value=""}
});
var linkTimer;
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="sig"&&$("allow"))$("allow").disabled=!consentOk();
  if(el.dataset.field){STATE.event[el.dataset.field]=el.value;P.dirty=true;renderStatus()}
  if(el.hasAttribute("data-link")){STATE.link=el.value;P.dirty=true;renderStatus();clearTimeout(linkTimer);linkTimer=setTimeout(renderQr,300)}
});
["dragover","dragleave","drop"].forEach(function(n){document.addEventListener(n,function(e){
  var d=$("drop");if(!d)return;
  if(e.target.closest&&e.target.closest("#drop")){e.preventDefault();d.classList.toggle("over",n==="dragover");if(n==="drop"&&e.dataTransfer)addFiles(e.dataTransfer.files)}
  else d.classList.remove("over");
})});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&A.open){A.open=null;render()}});
window.addEventListener("hashchange",function(){window.scrollTo(0,0);render()});
try{if(sessionStorage.getItem("r3-after")){sessionStorage.removeItem("r3-after");if(!view())location.hash="fotografo";setTimeout(function(){toast(t("pubOk"))},300)}}catch(e){}
render();
if(HOSTED){fetch("event.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.event&&Array.isArray(d.photos)&&!P.dirty&&!STATE.photos.length){STATE=d;if(!A.searched&&A.step==="consent"||view()!=="asistente")render()}}).catch(function(){})}
})();
</script>
